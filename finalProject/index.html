<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume & Cover Letter Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--<link rel="stylesheet" href="style.css">-->
</head>

<body>
    <header>

    </header>

    <main>
        <section class="container">
            <h1>Resume & Cover Letter Generator</h1>

            <fieldset>
                <legend>About</legend>
                <form>
                    <div class="form-group">
                        <label for="name"><strong>Name:</strong></label>
                        <input class="form-control" id="name" type="text" name="name">
                    </div>
                    <div class="form-group">
                        <label for="contact"><strong>Contact Info:</strong></label>
                        <input class="form-control" id="contact" type="text" name="contact">
                    </div>
                    <div class="form-group">
                        <label for="education"><strong>Education:</strong></label>
                        <input class="form-control" id="education" type="text" name="education">
                    </div>
                    <div class="form-group">
                        <label for="work-exp"><strong>Work Experience:</strong></label>
                        <textarea class="form-control" id="work-exp"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="skills"><strong>Skills:</strong></label>
                        <textarea class="form-control" id="skills"></textarea>
                    </div>
                    <fieldset>
                        <legend>For job that you are applying for</legend>
                        <div class="form-group">
                            <label for="title"><strong>Job Title:</strong></label>
                            <input class="form-control" id="title" type="text" name="title">
                        </div>
                        <div class="form-group">
                            <label for="description"><strong>Job Description:</strong></label>
                            <textarea class="form-control" id="description"></textarea>
                        </div>
                    </fieldset>
                    <div class="col-lg-4">
                        <button type="button" class="btn btn-light" id="resumeBtn">Build Resume</button>
                        <button type="button" class="btn btn-light" id="coverBtn">Generate Cover Letter</button>
                    </div>

                </form>
            </fieldset>
        </section>


    </main>

    <footer>

    </footer>

    <script src="script.js" defer> </script>
</body>

</html>
