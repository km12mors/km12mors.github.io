<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Document</title>
    <style>
        fieldset {
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        legend {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <form action="https://tiny-wolf-21.webhook.cool" method="POST" id="creature-form">
        <fieldset class="name">
            <legend>Name</legend>
            <div>
                <label for="name"><strong>Name:</strong></label>
                <input id="name" type="text" name="name" required>
            </div>
        </fieldset>
        <fieldset class="type">
            <legend>Type</legend>
            <div>
                <label for="type"><strong>Water</strong></label>
                <input id="type" type="radio" name="type">
            </div>
            <div>
                <label for="type"><strong>Fire</strong></label>
                <input id="type" type="radio" name="type">
            </div>
            <div>
                <label for="type"><strong>Rock</strong></label>
                <input id="type" type="radio" name="type">
            </div>
        </fieldset>
        <div>
            <fieldset class="points">
                <legend>Attack Points</legend>
                <label for="points"><strong>Attack Points:</strong></label>
                <input id="points" type="number" name="points" min="1">
            </fieldset>
        </div>
        <button id="fetch-btn" type="submit">Submit</button>
    </form>

    <script>
        const myForm = document.querySelector('#creature-form');

        myForm.addEventListener('submit', function (event) {
            event.preventDefault();
        });
    </script>
</body>


</html>
